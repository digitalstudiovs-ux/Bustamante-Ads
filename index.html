<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bustamante · Mi asistente</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#162660">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bustamante">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#EEEBDA;--ink:#282B4A;--card:#F9F7EE;--line:#D8D4BE;--acc:#162660;--on:#EEEBDA;--soft:#D0E6FD;--teal:#567C8D;--sand:#F1E4D1;--ok:#2f7d5b;--bad:#a94545;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d38;--ink:#EEEBDA;--card:#282B4A;--line:#3b3f69;--acc:#D0E6FD;--on:#162660;--soft:#33407a;--teal:#8fb3c4;--sand:#3a3a55;--ok:#7fd1a8;--bad:#f0a0a0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1d38;--ink:#EEEBDA;--card:#282B4A;--line:#3b3f69;--acc:#D0E6FD;--on:#162660;--soft:#33407a;--teal:#8fb3c4;--sand:#3a3a55;--ok:#7fd1a8;--bad:#f0a0a0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Inter,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 96px}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:900;letter-spacing:-.02em;line-height:1;margin:0}
h1{font-size:44px}h2{font-size:26px;margin:26px 0 10px}
small,.mut{color:var(--teal);font-size:13px}
.hero{background:var(--ink);color:var(--bg);border-radius:26px;padding:22px 20px;margin-bottom:6px}
.hero small{color:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
.stat{background:var(--soft);color:#162660;border-radius:16px;padding:10px}
.stat b{display:block;font:900 20px Fraunces,serif}.stat small{color:#162660;opacity:.75}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row>div{flex:1;min-width:0}
.row b.t{font:700 15px Fraunces,serif;min-width:48px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:8px}
.g2>*{min-width:0}
input[type=date],input[type=time]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;min-height:44px;text-align:left}
button{font:600 14px Inter,sans-serif;border:0;border-radius:12px;padding:10px 14px;background:var(--acc);color:var(--on);cursor:pointer}
button.ghost{background:var(--soft);color:#162660}
button.x{background:none;color:var(--teal);padding:4px 8px;font-size:20px}
button.full{width:100%}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--sand);color:var(--ink)}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--teal);border-radius:9px}
.in{color:var(--ok)}.out{color:var(--bad)}
.big{font:900 34px Fraunces,serif}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--ink);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;color:var(--bg);opacity:.6;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:4px 6px}
nav button span{font-size:20px}nav button.on{opacity:1;color:var(--soft)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;display:none;z-index:9}
canvas{width:100%;max-width:300px;display:block;margin:0 auto 10px;border-radius:18px;touch-action:none}
.hero{background:linear-gradient(135deg,#282B4A,#162660 55%,#567C8D);color:#EEEBDA;position:relative;overflow:hidden;box-shadow:0 14px 30px #16266044}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:#D0E6FD22}
.hero:before{content:"";position:absolute;right:40px;bottom:-70px;width:130px;height:130px;border-radius:50%;background:#F1E4D122}
.hero>*{position:relative;z-index:1}
#app{animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
button{transition:transform .12s,filter .15s}button:active{transform:scale(.95)}button:hover{filter:brightness(1.08)}
.card{transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px #16266026}
.stat{transition:transform .18s}.stat:hover{transform:scale(1.04)}
nav{border-radius:22px 22px 0 0;box-shadow:0 -8px 24px #16266040}
nav button span{transition:all .2s;padding:2px 14px;border-radius:14px}nav button.on span{background:#D0E6FD33;transform:translateY(-3px)}
.done{text-decoration:line-through;opacity:.5}
nav button{padding:4px 2px;font-size:10px;flex:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.cal>b{font-size:12px;color:var(--teal);padding-bottom:2px}
.cd{aspect-ratio:1;padding:2px;background:var(--bg);color:var(--ink);border-radius:12px;font:600 14px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:3px}.cd i{font-style:normal;font-size:10px;color:var(--teal);height:8px}.cd.td{outline:2px solid var(--teal)}.cd.sel{background:var(--acc);color:var(--on)}.cd.sel i{color:var(--on)}
.seg{display:flex;gap:6px;margin:14px 0 8px}.seg button{flex:1}
textarea{width:100%;height:74px;font:12px/1.3 monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0 0;resize:none}
.cf{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:20;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
const K='vb-app-v1',$=s=>document.querySelector(s),V=id=>document.getElementById(id).value;
const iso=(o=0)=>{const d=new Date();d.setDate(d.getDate()+o);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $$=n=>'$'+Math.round(n).toLocaleString('en-US');
const mo=(n,c)=>(c=='PEN'?'S/ ':'$')+Math.round(n).toLocaleString('en-US');
const fd=d=>new Date(d+'T12:00').toLocaleDateString('es',{weekday:'short',day:'numeric',month:'short'});
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],ST=['Nuevo','Llamada','Propuesta'];
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{pro:[{id:1,n:'Carlos M.',s:0},{id:2,n:'Andrea R.',s:2}],cli:[{id:3,n:'Luis P.',d:iso(-30),ss:9}],mt:[{id:4,t:'Mentoría con Luis P.',d:iso(),h:'10:00',k:'Mentoría'}],tx:[{id:5,t:'i',c:'Mentoría',n:'Luis P. · Programa 90 días',a:1200,d:iso(-30),p:1}],fo:[],wt:[],wa:{},best:0,mem:500,cd:4,ch:'19:00',tp:[]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let tab='hoy',raf=0,tt,fresh=1;
const saludo=()=>{const h=new Date().getHours();return h<12?'Buenos días,':h<19?'Buenas tardes,':'Buenas noches,'};
const confetti=()=>{for(let i=0;i<40;i++){const c=document.createElement('i');c.className='cf';c.style.cssText=`left:${Math.random()*100}vw;background:${['#D0E6FD','#F1E4D1','#567C8D','#162660'][i%4]};animation-delay:${Math.random()*.4}s;animation-duration:${1.2+Math.random()}s`;document.body.appendChild(c);setTimeout(()=>c.remove(),2600)}};
const enc=()=>{S.bk=iso();save();return 'VB1:'+btoa(unescape(encodeURIComponent(JSON.stringify(S))))};
const T=[['hoy','Hoy','🗓'],['age','Agenda','📅'],['men','Mentorías','🤝'],['com','Comunidad','👥'],['fin','Dinero','💰'],['sal','Salud','🥗'],['rel','Relax','🏎']];
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2200)};
const sel=(id,o)=>`<select id="${id}">${o.map((x,i)=>`<option value="${Array.isArray(x)?x[0]:x}">${Array.isArray(x)?x[1]:x}</option>`).join('')}</select>`;
const del=(k,id)=>`<button class="x" data-a="del" data-k="${k}" data-id="${id}" aria-label="Eliminar">×</button>`;
const mon=(c='USD')=>{const m=iso().slice(0,7),f=S.tx.filter(x=>x.p&&x.d.startsWith(m)&&(x.cu||'USD')==c);const i=f.filter(x=>x.t=='i').reduce((a,x)=>a+x.a,0),e=f.filter(x=>x.t=='e').reduce((a,x)=>a+x.a,0);return{i,e}};

function hoy(){const t=iso(),up=S.mt.filter(m=>m.d>=t).sort((a,b)=>(a.d+a.h).localeCompare(b.d+b.h)).slice(0,6),{i}=mon('USD'),{i:ip}=mon('PEN');
return `<div class="hero"><small>${fd(t)}</small><h1>Hola,<br>Bustamante</h1><small>VS Academy · Bustamante Ads</small>
<div class="stats"><div class="stat"><b class="cnt" data-n="${i}">${$$(i)}</b><small>Ingresos del mes · <b style="font:600 13px Inter,sans-serif;display:inline">${mo(ip,'PEN')}</b></small></div><div class="stat"><b>${S.pro.length}</b><small>Prospectos</small></div></div></div>
<h2>Mi agenda</h2><div class="card">${up.length?up.map(m=>`<div class="row"><button class="x" data-a="mdone" data-id="${m.id}" aria-label="Marcar hecha">${m.x?'✅':'⬜'}</button><b class="t">${m.h}</b><div class="${m.x?'done':''}">${esc(m.t)}<br><small>${m.d==t?'Hoy':fd(m.d)} · ${m.k}</small></div>${del('mt',m.id)}</div>`).join(''):'<small>No tienes reuniones próximas. Agenda la primera abajo.</small>'}</div>
<div class="card"><input id="mt" placeholder="Reunión (ej. Llamada con Andrea)" style="margin-bottom:8px"><div class="g2"><input id="md" type="date" value="${t}"><input id="mh" type="time" value="10:00"></div><div class="g2">${sel('mk',['Mentoría','Llamada de cierre','Comunidad','Otra'])}<button data-a="addmt">Agendar reunión</button></div></div>
<h2>Copia de seguridad</h2><div class="card"><small>${S.bk?'Último respaldo: '+fd(S.bk):'Aún no has hecho respaldo'}${(!S.bk||(new Date(t)-new Date(S.bk))/864e5>7)?' · ¡Toca respaldar!':''}</small><p style="margin:8px 0">Copia tu código y guárdalo en WhatsApp, notas o correo. En otro dispositivo, pégalo abajo y toca Restaurar.</p><div class="g2"><button data-a="bkcopy">Copiar respaldo</button><button class="ghost" data-a="bkshare">Compartir</button></div><textarea id="bk" placeholder="Pega aquí tu código para restaurar"></textarea><button class="ghost full" style="margin-top:8px" data-a="bkrest">Restaurar datos</button></div>`}

function men(){const t=iso();
return `<h1>Mentorías</h1><small>Programa de 90 días</small>
<h2>Prospectos por cerrar</h2><div class="card">${S.pro.length?S.pro.map(p=>`<div class="row"><div><b>${esc(p.n)}</b><br><span class="chip">${ST[p.s]} · ${mo(p.a||1200,p.cu)}</span></div><button class="ghost" data-a="adv" data-id="${p.id}">${p.s==2?'Cerrar '+mo(p.a||1200,p.cu):'Pasar a '+ST[p.s+1]}</button>${del('pro',p.id)}</div>`).join(''):'<small>Sin prospectos. Agrega el primero.</small>'}
<input id="pn" placeholder="Nombre del prospecto" style="margin:10px 0 8px"><div class="g2"><input id="pa" type="number" inputmode="decimal" placeholder="Monto (1200)"><select id="pm"><option value="USD">Dólares ($)</option><option value="PEN">Soles (S/)</option></select></div><button class="full" data-a="addpro">Agregar prospecto</button></div>
<h2>Clientes activos</h2>${S.cli.map(c=>{const day=Math.min(90,Math.max(1,Math.round((new Date(t)-new Date(c.d))/864e5)+1));return `<div class="card"><div class="row" style="border:0;padding:0"><div><b>${esc(c.n)}</b><br><small>Día ${day} de 90 · ${c.ss} de 26 sesiones</small></div><button class="ghost" data-a="ses" data-id="${c.id}">+ Sesión</button>${del('cli',c.id)}</div><div class="bar"><i style="width:${day/90*100}%"></i></div></div>`}).join('')||'<small>Aún no tienes clientes activos.</small>'}
<div class="card"><div class="g2" style="margin:0"><input id="cn" placeholder="Cliente que ya pagó"><button data-a="addcli">Agregar cliente</button></div></div>`}

function nextCom(){const n=new Date();let d=(S.cd-n.getDay()+7)%7;if(d==0&&new Date().toTimeString().slice(0,5)>S.ch)d=7;return iso(d)}
function com(){return `<h1>Comunidad</h1><small>Una reunión por semana</small>
<div class="card"><div class="big">${S.mem}</div><small>miembros en la comunidad</small><div class="g2" style="margin-top:10px"><input id="mm" type="number" value="${S.mem}"><button class="ghost" data-a="mem">Actualizar</button></div></div>
<h2>Reunión semanal</h2><div class="card"><div class="g2">${sel('cd',DIAS.map((x,i)=>[i,x])).replace(`value="${S.cd}"`,`value="${S.cd}" selected`)}<input id="ch" type="time" value="${S.ch}"></div><p style="margin:6px 0 10px">Próxima: <b>${fd(nextCom())} · ${S.ch}</b></p><div class="g2" style="margin:0"><button class="ghost" data-a="cfg">Guardar horario</button><button data-a="agcom">Agendar en Hoy</button></div></div>
<h2>Temas para la sesión</h2><div class="card">${S.tp.map(x=>`<div class="row"><div>${esc(x.n)}</div>${del('tp',x.id)}</div>`).join('')||'<small>Anota ideas, preguntas o temas para la próxima reunión.</small>'}<div class="g2" style="margin:10px 0 0"><input id="tn" placeholder="Nuevo tema"><button data-a="addtp">Agregar</button></div></div>`}

function fin(){const c=S.cv||'USD',{i,e}=mon(c),m=iso().slice(0,7),pend=S.tx.filter(x=>!x.p&&(x.cu||'USD')==c),pc=pend.filter(x=>x.t=='i').reduce((a,x)=>a+x.a,0),pp=pend.filter(x=>x.t=='e').reduce((a,x)=>a+x.a,0);
const L=[...S.tx].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,30);
return `<h1>Dinero</h1><small>Ventas, pagos e ingresos de ${new Date().toLocaleDateString('es',{month:'long'})}</small>
<div class="seg" style="margin-top:12px"><button class="${c=='USD'?'':'ghost'}" data-a="cv" data-v="USD">Dólares ($)</button><button class="${c=='PEN'?'':'ghost'}" data-a="cv" data-v="PEN">Soles (S/)</button></div><div class="card"><small>Balance del mes</small><div class="big ${i-e>=0?'in':'out'}">${mo(i-e,c)}</div><div class="g2" style="margin:8px 0 0"><div><small>Ingresos</small><br><b class="in">${mo(i,c)}</b></div><div><small>Egresos</small><br><b class="out">${mo(e,c)}</b></div></div><small>Por cobrar ${mo(pc,c)} · Por pagar ${mo(pp,c)}</small></div>
<div class="card"><div class="g2">${sel('xt',[['i','Ingreso (venta)'],['e','Egreso (gasto)']])}${sel('xc',['Mentoría','Curso','Comunidad','Venta','Publicidad','Software','Personal','Otro'])}</div><input id="xn" placeholder="Concepto" style="margin-bottom:8px"><div class="g2"><input id="xa" type="number" inputmode="decimal" placeholder="Monto"><select id="xm"><option value="USD" ${c=='USD'?'selected':''}>Dólares ($)</option><option value="PEN" ${c=='PEN'?'selected':''}>Soles (S/)</option></select></div><input id="xd" type="date" value="${iso()}" style="margin-bottom:8px"><div class="g2" style="margin:0">${sel('xp',[['1','Pagado'],['0','Pendiente']])}<button data-a="addtx">Guardar movimiento</button></div></div>
<div class="card">${L.map(x=>`<div class="row"><div>${esc(x.n||x.c)}<br><small>${fd(x.d)} · ${x.c}</small></div><div style="text-align:right"><b class="${x.t=='i'?'in':'out'}">${x.t=='i'?'+':'−'}${mo(x.a,x.cu)}</b><br><span class="chip" data-a="tog" data-id="${x.id}" style="cursor:pointer">${x.p?'Pagado':'Pendiente'}</span></div>${del('tx',x.id)}</div>`).join('')||'<small>Registra tu primer movimiento.</small>'}</div>`}

function sal(){const t=iso(),w=S.wa[t]||0,fo=S.fo.filter(x=>x.d==t),k=fo.reduce((a,x)=>a+(+x.k||0),0),wt=[...S.wt].sort((a,b)=>a.d.localeCompare(b.d)),la=wt[wt.length-1],df=wt.length>1?(la.kg-wt[0].kg).toFixed(1):0;
return `<h1>Salud</h1><small>Comer bien, moverte y bajar de peso</small>
<div class="card"><small>Peso actual</small><div class="big">${la?la.kg+' kg':'—'}</div><small>${wt.length>1?(df<=0?'Has bajado ':'Has subido ')+Math.abs(df)+' kg desde el inicio':'Registra tu peso para ver tu avance'}</small><div class="g2" style="margin-top:10px"><input id="wk" type="number" step="0.1" inputmode="decimal" placeholder="Peso en kg"><button data-a="addwt">Guardar peso</button></div></div>
<div class="card"><div class="row" style="border:0;padding:0"><svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="42" cy="42" r="34" fill="none" stroke="var(--teal)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${Math.min(1,w/8)*213.6} 213.6" transform="rotate(-90 42 42)"/><text x="42" y="49" text-anchor="middle" font-family="Fraunces,serif" font-weight="900" font-size="22" fill="currentColor">${w}</text></svg><div><b>Agua de hoy</b><br><small>${w>=8?'¡Meta cumplida! 🎉':w+' de 8 vasos'}</small></div><button class="ghost" data-a="wa" data-v="-1">−</button><button data-a="wa" data-v="1">+</button></div></div>
<h2>Comidas de hoy</h2><div class="card">${fo.map(x=>`<div class="row"><div>${esc(x.n)}<br><small>${x.m}${x.k?' · '+x.k+' kcal':''}</small></div>${del('fo',x.id)}</div>`).join('')||'<small>Aún no registras comidas hoy.</small>'}${k?`<p><b>Total: ${k} kcal</b></p>`:''}<div class="g2" style="margin-top:10px">${sel('fm',['Desayuno','Almuerzo','Cena','Snack'])}<input id="fk" type="number" inputmode="numeric" placeholder="Calorías (opcional)"></div><div class="g2" style="margin:0"><input id="fn" placeholder="¿Qué comiste?"><button data-a="addfo">Agregar</button></div></div>`}

function rel(){return `<h1>Relax</h1><small>Un break entre reuniones. Esquiva los carros.</small>
<div style="height:14px"></div><canvas id="cv" width="300" height="420"></canvas>
<div class="g2"><button data-a="gl">◀ Izquierda</button><button data-a="gr">Derecha ▶</button></div>
<p style="text-align:center;margin:8px 0"><b id="sc">Puntos: 0</b> · <small>Récord: ${S.best}</small></p><button class="ghost full" data-a="gn">Jugar de nuevo</button>
<h2>Mi música</h2><div class="card">${S.sp?`<iframe title="Reproductor de Spotify" src="https://open.spotify.com/embed/${S.sp.t}/${S.sp.id}?utm_source=generator" width="100%" height="${S.sp.t=='track'?152:352}" style="border:0;border-radius:14px;display:block" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe><div class="g2" style="margin:10px 0 0"><button class="ghost" data-a="spdel">Cambiar playlist</button><button class="ghost" data-a="spdel">Quitar</button></div><p style="margin:8px 0 0"><small>Para oír las canciones completas, inicia sesión en Spotify en este navegador.</small></p>`:`<p style="margin:0 0 8px">Pega el enlace de tu playlist favorita. En Spotify: abre la playlist, toca los tres puntos, Compartir y Copiar enlace.</p><input id="spu" placeholder="https://open.spotify.com/playlist/..." style="margin-bottom:8px"><button class="full" data-a="spsave">Guardar playlist</button>`}</div>`}

let G=null;
function game(){cancelAnimationFrame(raf);const c=$('#cv');if(!c)return;const x=c.getContext('2d'),W=300,H=420,lw=W/3;
G={l:1,ob:[],sc:0,sp:3,f:0,over:false};
const car=(cx,cy,col)=>{x.fillStyle=col;x.beginPath();x.roundRect(cx-17,cy-28,34,56,8);x.fill();x.fillStyle='#282B4A';x.fillRect(cx-11,cy-14,22,10);x.fillRect(cx-11,cy+8,22,8)};
const loop=()=>{x.fillStyle='#282B4A';x.fillRect(0,0,W,H);x.fillStyle='#EEEBDA55';for(let i=1;i<3;i++)for(let y=(G.f*G.sp)%40-40;y<H;y+=40)x.fillRect(i*lw-2,y,4,20);
if(!G.over){G.f++;if(G.f%Math.max(28,70-G.sc*2)==0)G.ob.push({l:Math.floor(Math.random()*3),y:-40});
G.ob.forEach(o=>o.y+=G.sp);const n=G.ob.length;G.ob=G.ob.filter(o=>o.y<H+40);const p=n-G.ob.length;if(p){G.sc+=p;G.sp+=.12*p;$('#sc').textContent='Puntos: '+G.sc}
if(G.ob.some(o=>o.l==G.l&&o.y>H-115&&o.y<H-40)){G.over=true;if(G.sc>S.best){S.best=G.sc;save()}}}
G.ob.forEach(o=>car(o.l*lw+lw/2,o.y,'#567C8D'));car(G.l*lw+lw/2,H-70,'#F1E4D1');
if(G.over){x.fillStyle='#EEEBDAEE';x.font='900 30px Fraunces,Georgia,serif';x.textAlign='center';x.fillText('¡Choque!',W/2,H/2-6);x.font='500 15px Inter,sans-serif';x.fillText(G.sc+' puntos',W/2,H/2+22);return}
raf=requestAnimationFrame(loop)};
c.onpointerdown=e=>{const r=c.getBoundingClientRect();mv(e.clientX-r.left<r.width/2?-1:1)};loop()}
const mv=d=>{if(G)G.l=Math.max(0,Math.min(2,G.l+d))};
addEventListener('keydown',e=>{if(tab=='rel'){if(e.key=='ArrowLeft')mv(-1);if(e.key=='ArrowRight')mv(1)}});

let ag={v:'sem',d:iso()};
const ad=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const ms=d=>S.mt.filter(m=>m.d==d).sort((a,b)=>a.h.localeCompare(b.h));
function age(){const t=iso(),{v,d}=ag,D=x=>new Date(x+'T12:00');
const mrow=m=>`<div class="row"><button class="x" data-a="mdone" data-id="${m.id}" aria-label="Marcar hecha">${m.x?'✅':'⬜'}</button><b class="t">${m.h}</b><div class="${m.x?'done':''}">${esc(m.t)}<br><small>${m.k}</small></div>${del('mt',m.id)}</div>`;
const L=x=>{const a=ms(x);return a.length?a.map(mrow).join(''):'<div style="margin-top:6px"><small>Libre. Sin reuniones este día.</small></div>'};
let body,title;
if(v=='dia'){title=D(d).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});body=`<div class="card">${L(d)}</div>`}
else if(v=='sem'){const s=ad(d,-((D(d).getDay()+6)%7));title='Semana del '+D(s).toLocaleDateString('es',{day:'numeric',month:'short'})+' al '+D(ad(s,6)).toLocaleDateString('es',{day:'numeric',month:'short'});body=Array.from({length:7},(_,i)=>{const x=ad(s,i);return `<div class="card" ${x==t?'style="border:2px solid var(--teal)"':''}><b data-a="agg" data-d="${x}" style="cursor:pointer;font:900 17px Fraunces,serif;text-transform:capitalize">${D(x).toLocaleDateString('es',{weekday:'long',day:'numeric'})}${x==t?' · Hoy':''}</b>${L(x)}</div>`}).join('')}
else{const y=+d.slice(0,4),m=+d.slice(5,7),f=d.slice(0,7)+'-01',off=(D(f).getDay()+6)%7,n=new Date(y,m,0).getDate();title=D(f).toLocaleDateString('es',{month:'long',year:'numeric'});
const cells=Array.from({length:n},(_,i)=>{const x=f.slice(0,8)+String(i+1).padStart(2,'0'),c=ms(x).length;return `<button class="cd ${x==d?'sel':''} ${x==t?'td':''}" data-a="agd" data-d="${x}">${i+1}<i>${'•'.repeat(Math.min(c,3))}</i></button>`}).join('');
body=`<div class="card"><div class="cal">${['L','M','X','J','V','S','D'].map(x=>`<b>${x}</b>`).join('')}${'<span></span>'.repeat(off)}${cells}</div></div><h2 style="margin:16px 0 8px;font-size:20px;text-transform:capitalize">${D(d).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}</h2><div class="card">${L(d)}</div>`}
return `<h1>Agenda</h1><div class="seg">${[['dia','Día'],['sem','Semana'],['mes','Mes']].map(x=>`<button class="${x[0]==v?'':'ghost'}" data-a="agv" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
<div class="row" style="border:0"><button class="ghost" data-a="agn" data-s="-1" aria-label="Anterior">◀</button><div style="text-align:center;font:900 19px Fraunces,serif;text-transform:capitalize">${title}</div><button class="ghost" data-a="agn" data-s="1" aria-label="Siguiente">▶</button></div>
<button class="ghost full" style="margin-bottom:12px" data-a="agh">Ir a hoy</button>${body}
<h2>Agendar reunión</h2><div class="card"><input id="mt" placeholder="Reunión (ej. Llamada con Andrea)" style="margin-bottom:8px"><div class="g2"><input id="md" type="date" value="${d}"><input id="mh" type="time" value="10:00"></div><div class="g2">${sel('mk',['Mentoría','Llamada de cierre','Comunidad','Otra'])}<button data-a="addmt">Agendar reunión</button></div></div>`}
const V_={hoy,age,men,com,fin,sal,rel};
function render(){cancelAnimationFrame(raf);$('#app').innerHTML=V_[tab]();if(fresh){fresh=0;const A=$('#app');A.style.animation='none';A.offsetHeight;A.style.animation='';document.querySelectorAll('.cnt').forEach(el=>{const n=+el.dataset.n,s=performance.now(),f=t=>{const p=Math.min(1,(t-s)/700);el.textContent=$$(n*p);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}$('#nav').innerHTML=T.map(t=>`<button class="${t[0]==tab?'on':''}" data-a="tab" data-v="${t[0]}"><span>${t[2]}</span>${t[1]}</button>`).join('');if(tab=='rel')game();save()}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset)});
const id=()=>Date.now()+Math.floor(Math.random()*1e3);
function act(a,d){const t=iso();
switch(a){
case 'tab':tab=d.v;fresh=1;window.scrollTo(0,0);break;
case 'mdone':{const m=S.mt.find(x=>x.id==d.id);m.x=!m.x;if(m.x)toast('¡Reunión completada!');break}
case 'del':S[d.k]=S[d.k].filter(x=>x.id!=d.id);break;
case 'addmt':if(!V('mt').trim())return toast('Escribe el nombre de la reunión');S.mt.push({id:id(),t:V('mt').trim(),d:V('md'),h:V('mh'),k:V('mk')});toast('Reunión agendada');break;
case 'addpro':if(!V('pn').trim())return toast('Escribe un nombre');S.pro.push({id:id(),n:V('pn').trim(),s:0,a:+V('pa')||1200,cu:V('pm')});break;
case 'adv':{const p=S.pro.find(x=>x.id==d.id);if(p.s<2)p.s++;else{S.pro=S.pro.filter(x=>x!=p);S.cli.push({id:id(),n:p.n,d:t,ss:0});S.tx.push({id:id(),t:'i',c:'Mentoría',n:p.n+' · Programa 90 días',a:p.a||1200,cu:p.cu||'USD',d:t,p:1});toast('¡Cerrado! Se registró '+mo(p.a||1200,p.cu)+' en Dinero');confetti()}break}
case 'addcli':if(!V('cn').trim())return toast('Escribe el nombre');S.cli.push({id:id(),n:V('cn').trim(),d:t,ss:0});break;
case 'ses':S.cli.find(x=>x.id==d.id).ss++;break;
case 'mem':S.mem=+V('mm')||0;toast('Actualizado');break;
case 'cfg':S.cd=+V('cd');S.ch=V('ch');toast('Horario guardado');break;
case 'agcom':S.mt.push({id:id(),t:'Reunión de la comunidad',d:nextCom(),h:S.ch,k:'Comunidad'});toast('Agendada en Hoy');break;
case 'addtp':if(!V('tn').trim())return;S.tp.push({id:id(),n:V('tn').trim()});break;
case 'addtx':{const a=parseFloat(V('xa'));if(!a||a<=0)return toast('Escribe un monto válido');S.tx.push({id:id(),t:V('xt'),c:V('xc'),n:V('xn').trim(),a,cu:V('xm'),d:V('xd')||t,p:+V('xp')});toast('Movimiento guardado');break}
case 'tog':{const x=S.tx.find(x=>x.id==d.id);x.p=x.p?0:1;break}
case 'addwt':{const k=parseFloat(V('wk'));if(!k)return toast('Escribe tu peso');S.wt=S.wt.filter(x=>x.d!=t);S.wt.push({d:t,kg:k});break}
case 'wa':S.wa[t]=Math.max(0,(S.wa[t]||0)+ +d.v);if(S.wa[t]==8){confetti();toast('¡8 vasos! Meta de hoy cumplida')}break;
case 'addfo':if(!V('fn').trim())return toast('Escribe qué comiste');S.fo.push({id:id(),d:t,m:V('fm'),n:V('fn').trim(),k:V('fk')});break;
case 'bkcopy':{const c=enc();navigator.clipboard.writeText(c).then(()=>toast('Código copiado. Guárdalo en tus notas o WhatsApp'),()=>{render();$('#bk').value=c;$('#bk').select();toast('Copia el código de la caja')});break}
case 'bkshare':{const c=enc();if(navigator.share){navigator.share({text:c}).catch(()=>{});break}return act('bkcopy',{})}
case 'bkrest':{try{const r=JSON.parse(decodeURIComponent(escape(atob(V('bk').trim().replace(/^VB1:/,'')))));if(!Array.isArray(r.tx)||!Array.isArray(r.pro))throw 0;S=r;toast('Datos restaurados')}catch(e){return toast('Código inválido. Cópialo completo')}break}
case 'agv':ag.v=d.v;break;
case 'agd':ag.d=d.d;break;
case 'agg':ag.d=d.d;ag.v='dia';break;
case 'agh':ag.d=t;break;
case 'agn':{const s=+d.s;if(ag.v=='mes'){const x=new Date(+ag.d.slice(0,4),+ag.d.slice(5,7)-1+s,1);ag.d=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-01'}else ag.d=ad(ag.d,s*(ag.v=='dia'?1:7));break}
case 'spsave':{const m=V('spu').match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(playlist|album|track|artist|show|episode)\/([A-Za-z0-9]+)/)||V('spu').match(/spotify:(playlist|album|track|artist|show|episode):([A-Za-z0-9]+)/);if(!m)return toast('Enlace no válido. Cópialo desde Spotify');S.sp={t:m[1],id:m[2]};toast('Playlist guardada');break}
case 'spdel':S.sp=null;break;
case 'cv':S.cv=d.v;break;
case 'gl':return mv(-1);case 'gr':return mv(1);case 'gn':return game();
}
render()}
render();
</script>
</body>
</html>
